[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysharpe"
version = "1.0.0"
description = "Evidence-based portfolio optimization and analysis for Canadian investors."
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "PySharpe Developers"}]
license = "MIT"
keywords = [
    "portfolio-optimization",
    "quantitative-finance",
    "asset-location",
    "tax-efficiency",
    "canadian-investing",
    "backtesting",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.11",
    "yfinance>=0.2",
    "PyPortfolioOpt>=1.5",
    "cvxpy>=1.5",
    "scikit-learn>=1.3",
    "urllib3>=2.6.3",
    "pymc>=5.10",
    "statsmodels>=0.14",
    "arch>=6.0",
    "duckdb>=0.10",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "streamlit>=1.52",
]

[project.optional-dependencies]
cli = [
    "matplotlib>=3.9",
]
gui = [
    "streamlit>=1.35",
    "altair>=5.3",
    "plotly>=5.24",
]
all = [
    "pysharpe[cli,gui]",
]
dev = [
    "pysharpe[all]",
    "ruff>=0.6",
    "pytest>=7.3",
    "pytest-cov>=4.1",
    "coverage>=7.5",
    "pandas-stubs>=2.2",
    "pyright>=1.1.411",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[project.scripts]
pysharpe = "pysharpe.cli:main"

[project.urls]
Homepage = "https://github.com/janusson/PySharpe/"
Issues = "https://github.com/janusson/PySharpe/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.exclude-package-data]
"pysharpe" = ["*.ipynb", "docs/*", "examples/*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "B",  # bugbear
    "I",  # import sorting
    "UP", # pyupgrade
]
ignore = [
    "E203",  # conflicts with ruff-format
    "E501",  # line length enforced by ruff-format
    # Syntax modernization deferred to a later phase (requires touching
    # runtime code). Re-enable once the codebase is modernized:
    "B905",  # zip() without strict=
    "UP007", # Optional[X] -> X | Y unions
    "UP017", # datetime.timezone.utc -> datetime.UTC
    "UP035", # typing.Callable -> collections.abc.Callable
    "UP045", # Optional[X] -> X | None
]

[tool.ruff.lint.per-file-ignores]
"tests/" = ["S101"]
"scripts/**" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--quiet --disable-warnings"
norecursedirs = [".git", "examples", "docs"]
markers = [
    "benchmark: Micro-benchmark coverage for performance-sensitive helpers.",
]
filterwarnings = [
    # arviz 1.x removed InferenceData (PySharpe doesn't use it directly; the warning
    # comes from pymc's transitive dependency and is harmless).
    "ignore::arviz.MigrationWarning",
    # Streamlit's "No runtime found" appears during test imports outside the server.
    "ignore:No runtime found:UserWarning:streamlit",
]
